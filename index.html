<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF9933">
    <title>🚩 Bhavya Mandir - Complete Temple Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF9933;
            --primary-dark: #e67e22;
            --primary-light: #ffb366;
            --secondary: #8B0000;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --indigo: #4f46e5;
            --dark-bg: #0f172a;
            --dark-surface: #1e293b;
            --light-bg: linear-gradient(135deg, #fef7e8 0%, #ffe8d6 100%);
            --light-surface: #ffffff;
            --text-dark: #1e293b;
            --text-light: #f1f5f9;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.02);
            --card-hover-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            color: var(--text-dark);
            transition: all 0.3s ease;
            min-height: 100vh;
        }
        body.dark {
            background: var(--dark-bg);
            color: var(--text-light);
        }
        body.dark .card, body.dark .modal-content, body.dark .top-bar, body.dark .nav-tabs, body.dark .login-card {
            background: var(--dark-surface);
            color: var(--text-light);
        }
        body.dark input, body.dark select, body.dark textarea {
            background: #334155;
            color: var(--text-light);
            border-color: #475569;
        }
        .app-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark), var(--secondary));
            border-radius: 28px; padding: 25px 30px; margin-bottom: 25px;
            color: white; display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 15px; position: relative; overflow: hidden;
            box-shadow: var(--card-shadow);
        }
        .header::before { content: "🕉️"; position: absolute; font-size: 140px; opacity: 0.08; right: -20px; bottom: -40px; }
        .header-left { display: flex; align-items: center; gap: 20px; z-index: 1; }
        .temple-logo {
            width: 70px; height: 70px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 36px; cursor: pointer; transition: all 0.3s ease; overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .temple-logo:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .temple-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-text h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; }
        .header-text p { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
        .top-bar {
            background: var(--light-surface); border-radius: 20px; padding: 15px 25px;
            margin-bottom: 25px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 12px; box-shadow: var(--card-shadow);
        }
        .user-badge { padding: 5px 15px; border-radius: 25px; font-size: 12px; font-weight: 600; }
        .badge-super-admin { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; }
        .badge-admin { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .badge-operator { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .badge-viewer { background: linear-gradient(135deg, #6b7280, #4b5563); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .card {
            background: var(--light-surface); border-radius: 24px; padding: 24px;
            box-shadow: var(--card-shadow); transition: all 0.3s ease;
            cursor: pointer; border: 1px solid rgba(255,153,51,0.1);
        }
        .card:hover { transform: translateY(-5px); box-shadow: var(--card-hover-shadow); border-color: var(--primary-light); }
        .card-icon { font-size: 40px; color: var(--primary); margin-bottom: 15px; }
        .card-title { font-size: 14px; font-weight: 500; opacity: 0.7; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        .card-value { font-size: 34px; font-weight: 800; }
        .nav-tabs {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px;
            background: var(--light-surface); padding: 12px; border-radius: 60px;
            box-shadow: var(--card-shadow);
        }
        .nav-tab {
            padding: 14px 28px; border: none; background: transparent; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.3s ease;
            color: inherit; font-size: 15px; display: flex; align-items: center; gap: 10px;
        }
        .nav-tab i { font-size: 18px; }
        .nav-tab.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 4px 12px rgba(255,153,51,0.3); }
        .nav-tab:hover:not(.active) { background: rgba(255,153,51,0.1); transform: translateY(-2px); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 14px 16px; border: 2px solid var(--border);
            border-radius: 14px; font-size: 15px; background: var(--light-surface);
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,153,51,0.15); }
        .btn {
            padding: 12px 24px; border: none; border-radius: 50px; cursor: pointer;
            font-weight: 600; transition: all 0.3s ease; display: inline-flex;
            align-items: center; gap: 10px; font-size: 14px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-primary:hover { transform: scale(0.98); box-shadow: 0 4px 12px rgba(255,153,51,0.3); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: white; }
        .btn-purple { background: linear-gradient(135deg, var(--purple), #7c3aed); color: white; }
        .table-container { overflow-x: auto; border-radius: 20px; max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; font-weight: 600; position: sticky; top: 0; }
        .badge { padding: 5px 14px; border-radius: 25px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-paid { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
        body.dark .badge-paid { background: linear-gradient(135deg, #064e3b, #065f46); color: #a7f3d0; }
        .badge-pending { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }
        body.dark .badge-pending { background: linear-gradient(135deg, #7f1d1d, #991b1b); color: #fecaca; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center;
            align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--light-surface); border-radius: 28px;
            max-width: 90%; width: 550px; max-height: 85vh; overflow-y: auto;
            padding: 30px; animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from { transform: translateY(-40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--dark-surface); color: white; padding: 14px 28px;
            border-radius: 60px; z-index: 2100; animation: toastSlide 0.3s ease; font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        @keyframes toastSlide {
            from { bottom: -80px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
        .member-photo {
            width: 45px; height: 45px; border-radius: 50%; object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: white;
        }
        .pending-row { background: rgba(239, 68, 68, 0.06); border-left: 4px solid var(--danger); }
        .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .login-card {
            background: var(--light-surface); border-radius: 32px; padding: 50px 45px;
            max-width: 500px; margin: 60px auto; box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            text-align: center;
        }
        .social-links { display: flex; justify-content: center; gap: 20px; margin: 25px 0; flex-wrap: wrap; }
        .social-icon {
            width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 26px; transition: all 0.3s ease; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .social-icon:hover { transform: scale(1.1); }
        .social-wa { background: #25D366; color: white; }
        .social-tg { background: #0088cc; color: white; }
        .social-fb { background: #1877f2; color: white; }
        .social-ig { background: linear-gradient(135deg, #feda77, #d62976, #962fbf); color: white; }
        .social-yt { background: #ff0000; color: white; }
        .year-selector { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 25px; padding: 18px; background: var(--light-surface); border-radius: 20px; }
        .about-section { line-height: 1.8; font-size: 16px; }
        .drive-card { background: linear-gradient(135deg, #4285f4, #34a853); color: white; }
        .sheet-card { background: linear-gradient(135deg, #0F9D58, #0b7e48); color: white; }
        @media (max-width: 768px) {
            .app-container { padding: 15px; }
            .header-text h1 { font-size: 1.1rem; }
            .nav-tab { padding: 10px 16px; font-size: 12px; }
            .card-value { font-size: 24px; }
            .login-card { margin: 30px 20px; padding: 35px 25px; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginContainer" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="login-card">
            <div style="font-size: 80px;">🕉️</div>

            </div>
            <div class="form-group">

            </div>
            <button class="btn btn-primary" onclick="doLogin()" style="width: 100%; justify-content: center; padding: 15px; font-size: 16px;">🔐 लॉगिन करें</button>
            
            <div style="margin-top: 18px;">

            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container" id="mainApp" style="display: none;">
        <div class="header">

        </div>
        
        <div class="top-bar">
            <div><i class="fas fa-user-circle" style="font-size: 18px;"></i> <span id="userName" style="font-weight: 600; font-size: 16px;">Loading...</span> <span class="user-badge" id="userRoleBadge"></span></div>

        </div>
        
        <div class="nav-tabs" id="navTabs">

            <button class="nav-tab" data-tab="social"><i class="fas fa-share-alt"></i> सोशल</button>
            <button class="nav-tab" data-tab="about"><i class="fas fa-info-circle"></i> जानकारी</button>

        <div id="pageContent"></div>

    <div class="modal" id="modal"><div class="modal-content"><div id="modalBody"></div><div style="margin-top: 25px; display: flex; gap: 12px; justify-content: flex-end;"><button class="btn btn-outline" onclick="closeModal()">रद्द करें</button><button class="btn btn-primary" id="modalConfirmBtn">पुष्टि करें</button></div></div></div>

    <script>
        // ==================== USERS DATABASE ====================
        const USERS = [
            { id: 1, username: "superadmin", password: "Bhavya@2026", role: "super_admin", name: "राजेंद्र यादव", mobile: "9876543210" },
            { id: 2, username: "admin", password: "admin123", role: "admin", name: "अरविंद सिंह यादव", mobile: "9876543211" },
            { id: 3, username: "operator", password: "Seva@2026", role: "operator", name: "ऑपरेटर", mobile: "9876543212" },
            { id: 4, username: "viewer", password: "View@2026", role: "viewer", name: "दर्शक", mobile: "9876543213" }
        ];
        
        let currentLang = "hi";
        let currentUser = null;
        let currentTab = "dashboard";
        let currentYear = new Date().getFullYear();
        let pendingResetRequest = false;
        
        const translations = {
            hi: {
                dashboard: "डैशबोर्ड", members: "दानदाता", payments: "भुगतान", pending: "बकाया",
                incomeExpense: "आय-व्यय", committee: "समिति", expenses: "खर्च", drive: "Google Drive",
                social: "सोशल", about: "जानकारी", users: "यूजर", settings: "सेटिंग्स",
                totalDonors: "कुल दानदाता", totalIncome: "कुल आय", totalPending: "कुल बकाया", totalExpense: "कुल व्यय",
                netBalance: "नेट बैलेंस", pendingDonors: "बकाया दानदाता", addDonor: "दानदाता जोड़ें", addPayment: "भुगतान जोड़ें",
                name: "नाम", mobile: "मोबाइल", village: "गांव", monthlyAmount: "मासिक राशि", status: "स्थिति", actions: "कार्य",
                paid: "जमा", pending_status: "बकाया", collectPayment: "जमा करें", sendReminder: "रिमाइंडर भेजें", receipt: "रसीद",
                edit: "संपादित करें", delete: "हटाएं", view: "देखें", save: "सेव करें", cancel: "रद्द करें", confirm: "पुष्टि करें"
            },
            en: {
                dashboard: "Dashboard", members: "Donors", payments: "Payments", pending: "Pending",
                incomeExpense: "Income-Expense", committee: "Committee", expenses: "Expenses", drive: "Google Drive",
                social: "Social", about: "About", users: "Users", settings: "Settings",
                totalDonors: "Total Donors", totalIncome: "Total Income", totalPending: "Total Pending", totalExpense: "Total Expense",
                netBalance: "Net Balance", pendingDonors: "Pending Donors", addDonor: "Add Donor", addPayment: "Add Payment",
                name: "Name", mobile: "Mobile", village: "Village", monthlyAmount: "Monthly Amount", status: "Status", actions: "Actions",
                paid: "Paid", pending_status: "Pending", collectPayment: "Collect", sendReminder: "Send Reminder", receipt: "Receipt",
                edit: "Edit", delete: "Delete", view: "View", save: "Save", cancel: "Cancel", confirm: "Confirm"
            }
        };
        
        function t(key) { return translations[currentLang][key] || translations.hi[key] || key; }
        
        let appData = {
            settings: {
                committeeName: "🚩 Bhavya Mandir Nirman Samiti",
                committeeBanner: "गुलाबपुरा, मोहनगढ़",
                upiId: "asryadavtkg@ybl",
                presidentName: "राजेंद्र यादव",
                secretaryName: "अरविंद सिंह यादव",
                defaultMonthlyAmount: 200,
                darkMode: false,
                logo: "",
                currentCommitteeYear: "2025-26",
                whatsappLink: "https://chat.whatsapp.com/",
                telegramLink: "https://t.me/",
                facebookLink: "https://facebook.com/",
                instagramLink: "https://instagram.com/",
                youtubeLink: "https://youtube.com/",
                googleSheetId: "",
                googleDriveFolderId: "",
                aboutText: "🚩 भव्य मंदिर निर्माण समिति का स्थापना 2020 में हुई थी। हमारा उद्देश्य भव्य मंदिर का निर्माण करना और समाज सेवा करना है।"
            },
            committeeMembers: [
                { id: 1, name: "राजेंद्र यादव", position: "अध्यक्ष", mobile: "9876543210", year: "2025-26", photo: "" },
                { id: 2, name: "अरविंद सिंह यादव", position: "सचिव", mobile: "9876543211", year: "2025-26", photo: "" }
            ],
            members: [],
            payments: [],
            expenses: [],
            users: USERS.map(u => ({ ...u }))
        };
        
        const monthNames = ["जनवरी", "फरवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"];
        const years = [2023, 2024, 2025, 2026, 2027, 2028, 2029, 2030];
        
        // ==================== INITIALIZATION ====================
        function init() {
            loadData();
            checkAuth();
            setupEventListeners();
            applyTheme();
        }
        
        function loadData() {
            const saved = localStorage.getItem("templeAppData");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = { ...appData, ...parsed };
                } catch(e) {}
            }
            
            if (appData.members.length === 0) {
                appData.members = [
                    { id: 1, name: "राम प्रसाद", fatherName: "सीता राम", mobile: "9876543210", village: "अयोध्या", address: "मंदिर के पास", monthlyAmount: 200, joinDate: "2024-01-01", photo: "" },
                    { id: 2, name: "हरि शंकर", fatherName: "राम शंकर", mobile: "9876543211", village: "वृंदावन", address: "मेन बाजार", monthlyAmount: 150, joinDate: "2024-01-15", photo: "" }
                ];
            }
            
            if (appData.payments.length === 0) {
                const currentDate = new Date();
                appData.members.forEach(member => {
                    for (let m = 0; m <= currentDate.getMonth(); m++) {
                        appData.payments.push({
                            id: Date.now() + m + member.id,
                            memberId: member.id,
                            memberName: member.name,
                            month: monthNames[m],
                            monthIndex: m,
                            year: currentDate.getFullYear(),
                            amountPaid: m === 0 ? member.monthlyAmount : 0,
                            pendingAmount: m === 0 ? 0 : member.monthlyAmount,
                            status: m === 0 ? "Paid" : "Pending",
                            receiptNo: m === 0 ? `BHAVYA-${currentDate.getFullYear()}-${member.id}` : "",
                            paymentDate: m === 0 ? new Date().toISOString().split('T')[0] : "",
                            paymentMode: m === 0 ? "UPI" : "",
                            addedBy: "system",
                            addedByName: "सिस्टम"

        function syncToGoogleSheets() {

        function importFromGoogleSheets() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.members) appData.members = data.members;
                        if (data.payments) appData.payments = data.payments;
                        if (data.expenses) appData.expenses = data.expenses;
                        if (data.committee) appData.committeeMembers = data.committee;
                        saveData();
                        showToast("✅ डेटा इम्पोर्ट हो गया!");
                        renderCurrentPage();
                    } catch(err) { alert("❌ गलत फाइल फॉर्मेट!"); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function generateMonthlySheets() {
            let csv = "महीना,वर्ष,कुल आय (₹),कुल व्यय (₹),शेष (₹)\n";
            years.forEach(year => {
                monthNames.forEach(month => {
                    const monthIncome = appData.payments.filter(p => p.status === "Paid" && p.year === year && p.month === month).reduce((s,p) => s + p.amountPaid, 0);
                    const monthExpense = appData.expenses.filter(e => e.year === year && e.month === month).reduce((s,e) => s + e.amount, 0);
                    csv += `${month},${year},${monthIncome},${monthExpense},${monthIncome - monthExpense}\n`;
                });
            });
            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `monthly_sheets_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("✅ मासिक शीट डाउनलोड हो गई!");
        }

            let csv = "सदस्य,मोबाइल,गांव,मासिक राशि,जॉइन तिथि,कुल जमा,कुल बकाया\n";
            appData.members.forEach(m => {
                const totalPaid = appData.payments.filter(p => p.memberId === m.id && p.status === "Paid").reduce((s,p) => s + p.amountPaid, 0);
                const totalPending = appData.payments.filter(p => p.memberId === m.id && p.status === "Pending").reduce((s,p) => s + p.pendingAmount, 0);
                csv += `${m.name},${m.mobile},${m.village},${m.monthlyAmount},${m.joinDate},${totalPaid},${totalPending}\n`;
            });
            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `master_sheet_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("✅ Master Sheet डाउनलोड हो गई!");
        }
        
        function downloadBackup() {
            const backup = { members: appData.members, payments: appData.payments, expenses: appData.expenses, settings: appData.settings, committeeMembers: appData.committeeMembers, backupDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `temple_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("✅ बैकअप डाउनलोड हो गया!");
        }
        
        // ==================== QUICK RENDER FUNCTIONS (Placeholders for other tabs) ====================
        function renderMembers() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>👥 दानदाता प्रबंधन</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderPayments() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>💰 भुगतान प्रबंधन</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderPending() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>⏰ बकाया दानदाता</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderIncomeExpense() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>📈 आय-व्यय रिपोर्ट</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderCommittee() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>🏛️ समिति सदस्य</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderExpenses() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>📉 खर्च प्रबंधन</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderSocial() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>🌐 सोशल मीडिया</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        function renderAbout() { document.getElementById("pageContent").innerHTML = `<div class="card"><h3>ℹ️ समिति के बारे में</h3><p>पूरा फीचर जल्द आ रहा है...</p></div>`; }
        
        function renderUsers() {
            if (!hasPermission("manage_users")) {
                document.getElementById("pageContent").innerHTML = "<div class='card'><h3>🔒 Access Denied</h3><p>केवल एडमिन ही यूजर देख सकते हैं।</p></div>";
                return;
            }
            const html = `
                <div style="margin-bottom:20px;"><button class="btn btn-primary" onclick="showAddUserModal()"><i class="fas fa-user-plus"></i> नया यूजर जोड़ें</button>
                ${currentUser?.role === "super_admin" ? `<button class="btn btn-danger" onclick="resetAllData()" style="margin-left:10px;"><i class="fas fa-trash"></i> पूरा डेटा रीसेट (एडमिन पुष्टि आवश्यक)</button>` : ''}</div>
                <div class="card"><div class="table-container"><table style="font-size:13px;"><thead><tr><th>यूजरनेम</th><th>नाम</th><th>मोबाइल</th><th>रोल</th><th>अधिकार</th><th>कार्य</th></tr></thead>
                <tbody>${USERS.map(u => `<tr><td>${u.username}<td>${u.name}<td><input type="tel" id="mobile_${u.id}" value="${u.mobile}" style="width:120px; padding:8px;" ${!hasPermission("manage_users") ? 'disabled' : ''}><td>${u.role === 'super_admin' ? '🇮🇳 सुपर एडमिन' : (u.role === 'admin' ? '👑 एडमिन' : (u.role === 'operator' ? '🔧 ऑपरेटर' : '👁️ दर्शक'))}<td>${u.role === 'operator' ? 'दानदाता + भुगतान' : (u.role === 'admin' ? 'पूरा कंट्रोल' : (u.role === 'super_admin' ? 'पूरा कंट्रोल' : 'केवल देखें'))}
                <td class="action-btns">${hasPermission("manage_users") ? `<button class="btn btn-warning" onclick="updateUserMobileAndPass(${u.id})" style="padding:6px 12px;">अपडेट करें</button>` : ''}
                ${u.username !== 'superadmin' && hasPermission("manage_users") ? `<button class="btn btn-danger" onclick="deleteUser(${u.id})" style="padding:6px 12px;">हटाएं</button>` : ''}
                ${u.role === 'operator' && currentUser?.role === 'super_admin' ? `<button class="btn btn-primary" onclick="makeAdmin(${u.id})" style="padding:6px 12px;">एडमिन बनाएं</button>` : ''}
                ${u.role === 'admin' && currentUser?.role === 'super_admin' && u.username !== 'admin' ? `<button class="btn btn-warning" onclick="makeOperator(${u.id})" style="padding:6px 12px;">ऑपरेटर बनाएं</button>` : ''}
                </td>`).join('')}</tbody></table></div></div>`;
            document.getElementById("pageContent").innerHTML = html;
        }
        
        function updateUserMobileAndPass(userId) {
            const mobile = document.getElementById(`mobile_${userId}`).value;
            if(mobile.length !== 10) { alert("❌ मोबाइल नंबर 10 अंक का होना चाहिए!"); return; }
            const newPass = prompt("नया पासवर्ड डालें (खाली छोड़ने पर नहीं बदलेगा):");
            const user = USERS.find(u => u.id === userId);
            if(user) {
                user.mobile = mobile;
                const appUser = appData.users.find(u => u.id === userId);
                if(appUser) appUser.mobile = mobile;
                if(newPass && newPass.length >= 4) {
                    user.password = newPass;
                    if(appUser) appUser.password = newPass;
                }
                saveData();
                alert(`✅ ${user.username} की जानकारी अपडेट हो गई!`);
                renderUsers();
            }
        }
        
        function showAddUserModal() {
            const modalBody = document.getElementById("modalBody");
            modalBody.innerHTML = `<h3>➕ नया यूजर जोड़ें</h3>
                <div class="form-group"><label>यूजरनेम</label><input type="text" id="username"></div>
                <div class="form-group"><label>नाम</label><input type="text" id="name"></div>
                <div class="form-group"><label>मोबाइल नंबर *</label><input type="tel" id="mobile" placeholder="10 अंक"></div>
                <div class="form-group"><label>पासवर्ड</label><input type="password" id="password"></div>
                <div class="form-group"><label>रोल</label><select id="role"><option value="viewer">👁️ दर्शक</option><option value="operator">🔧 ऑपरेटर</option><option value="admin">👑 एडमिन</option></select></div>`;
            document.getElementById("modalConfirmBtn").onclick = () => {
                if(!document.getElementById("username").value || !document.getElementById("password").value || !document.getElementById("mobile").value) { alert("❌ सभी फील्ड जरूरी हैं!"); return; }
                if(document.getElementById("mobile").value.length !== 10) { alert("❌ मोबाइल 10 अंक का होना चाहिए!"); return; }
                const newId = USERS.length + 1;
                USERS.push({ id: newId, username: document.getElementById("username").value, name: document.getElementById("name").value, mobile: document.getElementById("mobile").value, password: document.getElementById("password").value, role: document.getElementById("role").value });
                appData.users.push({ id: newId, username: document.getElementById("username").value, name: document.getElementById("name").value, mobile: document.getElementById("mobile").value, password: document.getElementById("password").value, role: document.getElementById("role").value });
                saveData(); closeModal(); renderUsers(); showToast("✅ यूजर जुड़ गया!");
            };
            document.getElementById("modal").style.display = "flex";
        }
        
        function deleteUser(userId) {
            if(confirm("यूजर हटाएं?")) {
                const index = USERS.findIndex(u => u.id === userId);
                if (index !== -1 && USERS[index].username !== 'superadmin') {
                    USERS.splice(index, 1);
                    appData.users = appData.users.filter(u => u.id !== userId);
                    saveData();
                    renderUsers();
                    showToast("✅ यूजर हटा दिया गया!");
                } else { alert("❌ सुपर एडमिन को नहीं हटा सकते!"); }
            }
        }
        
        function makeAdmin(userId) {
            if(confirm("इस ऑपरेटर को एडमिन बनाएं?")) {
                const user = USERS.find(u => u.id === userId);
                if(user && user.role === "operator") { user.role = "admin"; const appUser = appData.users.find(u => u.id === userId); if(appUser) appUser.role = "admin"; saveData(); renderUsers(); showToast("✅ अब यह एडमिन है!"); }
            }
        }
        
        function makeOperator(userId) {
            if(confirm("इस एडमिन को ऑपरेटर बनाएं?")) {
                const user = USERS.find(u => u.id === userId);
                if(user && user.role === "admin" && user.username !== 'admin') { user.role = "operator"; const appUser = appData.users.find(u => u.id === userId); if(appUser) appUser.role = "operator"; saveData(); renderUsers(); showToast("✅ अब यह ऑपरेटर है!"); }
                else { alert("❌ डिफॉल्ट एडमिन को नहीं बदला जा सकता!"); }
            }
        }
        
        function renderSettings() {
            if (!hasPermission("manage_settings")) {
                document.getElementById("pageContent").innerHTML = "<div class='card'><h3>🔒 Access Denied</h3><p>केवल एडमिन ही सेटिंग्स बदल सकते हैं।</p></div>";
                return;
            }
            const html = `
                <div class="card"><h3>⚙️ समिति सेटिंग्स</h3>
                    <div class="form-group"><label>समिति का नाम</label><input type="text" id="committeeName" value="${appData.settings.committeeName}"></div>
                    <div class="form-group"><label>बैनर</label><input type="text" id="committeeBanner" value="${appData.settings.committeeBanner}"></div>
                    <div class="form-group"><label>UPI ID</label><input type="text" id="upiId" value="${appData.settings.upiId}"></div>
                    <div class="form-group"><label>अध्यक्ष का नाम</label><input type="text" id="presidentName" value="${appData.settings.presidentName}"></div>
                    <div class="form-group"><label>सचिव का नाम</label><input type="text" id="secretaryName" value="${appData.settings.secretaryName}"></div>
                    <div class="form-group"><label>डिफॉल्ट मासिक राशि</label><input type="number" id="defaultMonthlyAmount" value="${appData.settings.defaultMonthlyAmount}"></div>
                    <button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> सेव करें</button>
                </div>
                <div class="card" style="margin-top:20px;"><h3>🖼️ लोगो बदलें</h3><input type="file" id="logoInput" accept="image/*"><div id="logoPreview"></div>
                <button class="btn btn-primary" onclick="changeLogo()">लोगो अपलोड करें</button></div>`;
            document.getElementById("pageContent").innerHTML = html;
            if(appData.settings.logo) document.getElementById("logoPreview").innerHTML = `<img src="${appData.settings.logo}" style="width:80px;height:80px;border-radius:50%;margin-top:10px;">`;
        }
        
        function saveSettings() {
            appData.settings.committeeName = document.getElementById("committeeName").value;
            appData.settings.committeeBanner = document.getElementById("committeeBanner").value;
            appData.settings.upiId = document.getElementById("upiId").value;
            appData.settings.presidentName = document.getElementById("presidentName").value;
            appData.settings.secretaryName = document.getElementById("secretaryName").value;
            appData.settings.defaultMonthlyAmount = parseInt(document.getElementById("defaultMonthlyAmount").value);
            document.getElementById("committeeName").innerText = appData.settings.committeeName;
            document.getElementById("committeeBanner").innerText = appData.settings.committeeBanner;
            saveData();
            showToast("✅ सेटिंग्स सेव हो गई!");
        }
        
        function changeLogo() {
            const input = document.getElementById("logoInput");
            if(input && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => { appData.settings.logo = ev.target.result; saveData(); document.getElementById("templeLogo").innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; showToast("✅ लोगो बदल गया!"); };
                reader.readAsDataURL(input.files[0]);
            } else { alert("❌ पहले फोटो select करें!"); }
        }
        
        // ==================== HELPERS ====================
        function setupEventListeners() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentTab = tab.dataset.tab;
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderCurrentPage();
                });
            });
        }
        
        function switchTab(tabName) { currentTab = tabName; renderCurrentPage(); }
        function renderCurrentPage() {
            switch(currentTab) {
                case "dashboard": renderDashboard(); break;
                case "members": renderMembers(); break;
                case "payments": renderPayments(); break;
                case "pending": renderPending(); break;
                case "incomeExpense": renderIncomeExpense(); break;
                case "committee": renderCommittee(); break;
                case "expenses": renderExpenses(); break;
                case "drive": renderDrive(); break;
                case "social": renderSocial(); break;
                case "about": renderAbout(); break;
                case "users": renderUsers(); break;
                case "settings": renderSettings(); break;
                default: renderDashboard();
            }
        }
        
        function toggleLanguage() { 
            currentLang = currentLang === "hi" ? "en" : "hi";
            document.querySelector(".lang-btn").innerHTML = currentLang === "hi" ? "🌐 हिंदी" : "🌐 English";
            renderCurrentPage();
            updateNavTexts();
        }
        
        function updateNavTexts() {
            const tabs = ["dashboard", "members", "payments", "pending", "incomeExpense", "committee", "expenses", "drive", "social", "about", "users", "settings"];
            document.querySelectorAll(".nav-tab").forEach((tab, i) => { if(tabs[i]) tab.innerHTML = tab.innerHTML.replace(/[^<]*/, `<i class="${tab.innerHTML.match(/<i class="([^"]+)"/)[1]}"></i> ${t(tabs[i])}`); });
        }
        
        function toggleDarkMode() { document.body.classList.toggle('dark'); appData.settings.darkMode = document.body.classList.contains('dark'); saveData(); }
        function applyTheme() { if(appData.settings.darkMode) document.body.classList.add('dark'); if(appData.settings.logo) document.getElementById("templeLogo").innerHTML = `<img src="${appData.settings.logo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; }
        function closeModal() { document.getElementById("modal").style.display = "none"; }
        function showToast(message) { let toast = document.querySelector('.toast'); if(toast) toast.remove(); toast = document.createElement('div'); toast.className = 'toast'; toast.innerHTML = message; document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
        
        init();
    </script>
</body>
</html>
