<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF9933">
    <title>🚩 Bhavya Mandir - Complete Temple Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF9933;
            --primary-dark: #e67e22;
            --primary-light: #ffb366;
            --secondary: #8B0000;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --indigo: #4f46e5;
            --teal: #14b8a6;
            --orange: #f97316;
            --cyan: #06b6d4;
            --dark-bg: #0f172a;
            --dark-surface: #1e293b;
            --light-bg: linear-gradient(135deg, #fef7e8 0%, #ffe8d6 100%);
            --light-surface: #ffffff;
            --text-dark: #1e293b;
            --text-light: #f1f5f9;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.02);
            --card-hover-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            color: var(--text-dark);
            transition: all 0.3s ease;
            min-height: 100vh;
        }
        body.dark {
            background: var(--dark-bg);
            color: var(--text-light);
        }
        body.dark .card, body.dark .modal-content, body.dark .top-bar, body.dark .nav-tabs, body.dark .login-card {
            background: var(--dark-surface);
            color: var(--text-light);
        }
        body.dark input, body.dark select, body.dark textarea {
            background: #334155;
            color: var(--text-light);
            border-color: #475569;
        }
        .app-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark), var(--secondary));
            border-radius: 28px; padding: 25px 30px; margin-bottom: 25px;
            color: white; display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 15px; position: relative; overflow: hidden;
            box-shadow: var(--card-shadow);
        }
        .header::before { content: "🕉️"; position: absolute; font-size: 140px; opacity: 0.08; right: -20px; bottom: -40px; }
        .header-left { display: flex; align-items: center; gap: 20px; z-index: 1; }
        .temple-logo {
            width: 70px; height: 70px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 36px; cursor: pointer; transition: all 0.3s ease; overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .temple-logo:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .temple-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-text h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; }
        .header-text p { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
        .top-bar {
            background: var(--light-surface); border-radius: 20px; padding: 15px 25px;
            margin-bottom: 25px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 12px; box-shadow: var(--card-shadow);
        }
        .user-badge { padding: 5px 15px; border-radius: 25px; font-size: 12px; font-weight: 600; }
        .badge-super-admin { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; }
        .badge-admin { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .badge-operator { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .badge-viewer { background: linear-gradient(135deg, #6b7280, #4b5563); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .card {
            background: var(--light-surface); border-radius: 24px; padding: 24px;
            box-shadow: var(--card-shadow); transition: all 0.3s ease;
            cursor: pointer; border: 1px solid rgba(255,153,51,0.1);
        }
        .card:hover { transform: translateY(-5px); box-shadow: var(--card-hover-shadow); border-color: var(--primary-light); }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card-title { font-size: 14px; font-weight: 500; opacity: 0.7; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        .card-value { font-size: 34px; font-weight: 800; }
        .nav-tabs {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px;
            background: var(--light-surface); padding: 12px; border-radius: 60px;
            box-shadow: var(--card-shadow);
        }
        .nav-tab {
            padding: 14px 28px; border: none; background: transparent; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: all 0.3s ease;
            color: inherit; font-size: 15px; display: flex; align-items: center; gap: 10px;
        }
        .nav-tab i { font-size: 18px; }
        .nav-tab.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 4px 12px rgba(255,153,51,0.3); }
        .nav-tab:hover:not(.active) { background: rgba(255,153,51,0.1); transform: translateY(-2px); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select, textarea {
            width: 100%; padding: 14px 16px; border: 2px solid var(--border);
            border-radius: 14px; font-size: 15px; background: var(--light-surface);
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,153,51,0.15); }
        .btn {
            padding: 12px 24px; border: none; border-radius: 50px; cursor: pointer;
            font-weight: 600; transition: all 0.3s ease; display: inline-flex;
            align-items: center; gap: 10px; font-size: 14px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-primary:hover { transform: scale(0.98); box-shadow: 0 4px 12px rgba(255,153,51,0.3); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: white; }
        .btn-purple { background: linear-gradient(135deg, var(--purple), #7c3aed); color: white; }
        .btn-teal { background: linear-gradient(135deg, var(--teal), #0d9488); color: white; }
        .table-container { overflow-x: auto; border-radius: 20px; max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; font-weight: 600; position: sticky; top: 0; }
        .badge { padding: 5px 14px; border-radius: 25px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-paid { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
        body.dark .badge-paid { background: linear-gradient(135deg, #064e3b, #065f46); color: #a7f3d0; }
        .badge-pending { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }
        body.dark .badge-pending { background: linear-gradient(135deg, #7f1d1d, #991b1b); color: #fecaca; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center;
            align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--light-surface); border-radius: 28px;
            max-width: 90%; width: 550px; max-height: 85vh; overflow-y: auto;
            padding: 30px; animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from { transform: translateY(-40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--dark-surface); color: white; padding: 14px 28px;
            border-radius: 60px; z-index: 2100; animation: toastSlide 0.3s ease; font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        @keyframes toastSlide {
            from { bottom: -80px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
        .member-photo {
            width: 45px; height: 45px; border-radius: 50%; object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: white;
        }
        .pending-row { background: rgba(239, 68, 68, 0.06); border-left: 4px solid var(--danger); }
        .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .login-card {
            background: var(--light-surface); border-radius: 32px; padding: 50px 45px;
            max-width: 500px; margin: 60px auto; box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            text-align: center;
        }
        .social-links { display: flex; justify-content: center; gap: 20px; margin: 25px 0; flex-wrap: wrap; }
        .social-icon {
            width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 26px; transition: all 0.3s ease; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .social-icon:hover { transform: scale(1.1); }
        .social-wa { background: #25D366; color: white; }
        .social-tg { background: #0088cc; color: white; }
        .social-fb { background: #1877f2; color: white; }
        .social-ig { background: linear-gradient(135deg, #feda77, #d62976, #962fbf); color: white; }
        .social-yt { background: #ff0000; color: white; }
        .year-selector { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 25px; padding: 18px; background: var(--light-surface); border-radius: 20px; }
        @media (max-width: 768px) {
            .app-container { padding: 15px; }
            .header-text h1 { font-size: 1.1rem; }
            .nav-tab { padding: 10px 16px; font-size: 12px; }
            .card-value { font-size: 24px; }
            .login-card { margin: 30px 20px; padding: 35px 25px; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginContainer" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="login-card">
            <div style="font-size: 80px;">🕉️</div>
            <h2 style="color: var(--primary); margin-top: 15px; font-size: 2rem;">Bhavya Mandir</h2>
            <p style="opacity: 0.7; margin-bottom: 35px; font-size: 1rem;">Nirman Samiti</p>
            
            <div class="form-group">
                <label>यूजरनेम / Username</label>
                <input type="text" id="loginUsername" placeholder="superadmin / admin / operator" style="font-size: 16px; padding: 15px;">
            </div>
            <div class="form-group">
                <label>पासवर्ड / Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" style="font-size: 16px; padding: 15px;">
            </div>
            <button class="btn btn-primary" onclick="doLogin()" style="width: 100%; justify-content: center; padding: 15px; font-size: 16px;">🔐 लॉगिन करें</button>
            
            <div style="margin-top: 18px;">
                <a href="#" onclick="showForgotPassword()" style="color: var(--primary); font-size: 14px;">पासवर्ड भूल गए?</a>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container" id="mainApp" style="display: none;">
        <div class="header">
            <div class="header-left">
                <div class="temple-logo" id="templeLogo" onclick="changeLogo()"><i class="fas fa-temple"></i></div>
                <div class="header-text">
                    <h1 id="committeeName">🚩 Bhavya Mandir Nirman Samiti</h1>
                    <p id="committeeBanner">गुलाबपुरा, मोहनगढ़</p>
                </div>
            </div>
            <div class="header-actions" style="display: flex; gap: 12px;">
                <div class="lang-btn" onclick="toggleLanguage()" style="background: rgba(255,255,255,0.2); padding: 10px 16px; border-radius: 40px; cursor: pointer;">🌐 हिंदी</div>
                <div class="dark-toggle" onclick="toggleDarkMode()" style="background: rgba(255,255,255,0.2); padding: 10px 16px; border-radius: 40px; cursor: pointer;">🌙</div>
            </div>
        </div>
        
        <div class="top-bar">
            <div><i class="fas fa-user-circle" style="font-size: 18px;"></i> <span id="userName" style="font-weight: 600; font-size: 16px;">Loading...</span> <span class="user-badge" id="userRoleBadge"></span></div>
            <div><i class="fas fa-key" onclick="showChangePassword()" style="cursor: pointer; font-size: 18px;"></i> <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor: pointer; margin-left: 20px; font-size: 18px;"></i></div>
        </div>
        
        <div class="nav-tabs" id="navTabs">
            <button class="nav-tab active" data-tab="dashboard"><i class="fas fa-tachometer-alt" style="color: #FF9933;"></i> डैशबोर्ड</button>
            <button class="nav-tab" data-tab="members"><i class="fas fa-users" style="color: #3b82f6;"></i> दानदाता</button>
            <button class="nav-tab" data-tab="payments"><i class="fas fa-rupee-sign" style="color: #10b981;"></i> भुगतान</button>
            <button class="nav-tab" data-tab="pending"><i class="fas fa-clock" style="color: #f59e0b;"></i> बकाया</button>
            <button class="nav-tab" data-tab="incomeExpense"><i class="fas fa-chart-line" style="color: #8b5cf6;"></i> आय-व्यय</button>
            <button class="nav-tab" data-tab="committee"><i class="fas fa-user-tie" style="color: #ec4899;"></i> समिति</button>
            <button class="nav-tab" data-tab="expenses"><i class="fas fa-shopping-cart" style="color: #ef4444;"></i> खर्च</button>
            <button class="nav-tab" data-tab="drive"><i class="fab fa-google-drive" style="color: #4285f4;"></i> Google Drive</button>
            <button class="nav-tab" data-tab="social"><i class="fas fa-share-alt" style="color: #25D366;"></i> सोशल</button>
            <button class="nav-tab" data-tab="about"><i class="fas fa-info-circle" style="color: #14b8a6;"></i> जानकारी</button>
            <button class="nav-tab" data-tab="users"><i class="fas fa-user-shield" style="color: #8b5cf6;"></i> यूजर</button>
            <button class="nav-tab" data-tab="settings"><i class="fas fa-cog" style="color: #6b7280;"></i> सेटिंग्स</button>
        </div>
        
        <div id="pageContent"></div>
    </div>

    <div class="modal" id="modal"><div class="modal-content"><div id="modalBody"></div><div style="margin-top: 25px; display: flex; gap: 12px; justify-content: flex-end;"><button class="btn btn-outline" onclick="closeModal()">रद्द करें</button><button class="btn btn-primary" id="modalConfirmBtn">पुष्टि करें</button></div></div></div>

    <script>
        // ==================== USERS DATABASE ====================
        const USERS = [
            { id: 1, username: "superadmin", password: "Bhavya@2026", role: "super_admin", name: "राजेंद्र यादव", mobile: "9876543210" },
            { id: 2, username: "admin", password: "admin123", role: "admin", name: "अरविंद सिंह यादव", mobile: "9876543211" },
            { id: 3, username: "operator", password: "Seva@2026", role: "operator", name: "ऑपरेटर", mobile: "9876543212" },
            { id: 4, username: "viewer", password: "View@2026", role: "viewer", name: "दर्शक", mobile: "9876543213" }
        ];
        
        let currentLang = "hi";
        let currentUser = null;
        let currentTab = "dashboard";
        let currentYear = new Date().getFullYear();
        
        const translations = {
            hi: { dashboard: "डैशबोर्ड", members: "दानदाता", payments: "भुगतान", pending: "बकाया", incomeExpense: "आय-व्यय", committee: "समिति", expenses: "खर्च", drive: "Google Drive", social: "सोशल", about: "जानकारी", users: "यूजर", settings: "सेटिंग्स" },
            en: { dashboard: "Dashboard", members: "Donors", payments: "Payments", pending: "Pending", incomeExpense: "Income-Expense", committee: "Committee", expenses: "Expenses", drive: "Google Drive", social: "Social", about: "About", users: "Users", settings: "Settings" }
        };
        function t(key) { return translations[currentLang][key] || translations.hi[key] || key; }
        
        let appData = {
            settings: {
                committeeName: "🚩 Bhavya Mandir Nirman Samiti", committeeBanner: "गुलाबपुरा, मोहनगढ़", upiId: "asryadavtkg@ybl",
                presidentName: "राजेंद्र यादव", secretaryName: "अरविंद सिंह यादव", defaultMonthlyAmount: 200, darkMode: false, logo: "",
                currentCommitteeYear: "2025-26", whatsappLink: "https://chat.whatsapp.com/", telegramLink: "https://t.me/", facebookLink: "https://facebook.com/",
                instagramLink: "https://instagram.com/", youtubeLink: "https://youtube.com/", googleSheetId: "", googleDriveFolderId: "", aboutText: "🚩 भव्य मंदिर निर्माण समिति का स्थापना 2020 में हुई थी।"
            },
            committeeMembers: [{ id: 1, name: "राजेंद्र यादव", position: "अध्यक्ष", mobile: "9876543210", year: "2025-26", photo: "" }, { id: 2, name: "अरविंद सिंह यादव", position: "सचिव", mobile: "9876543211", year: "2025-26", photo: "" }],
            members: [], payments: [], expenses: [], users: USERS.map(u => ({ ...u }))
        };
        
        const monthNames = ["जनवरी", "फरवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"];
        const years = [2023, 2024, 2025, 2026, 2027, 2028, 2029, 2030];
        
        // ==================== INITIALIZATION ====================
        function init() {
            loadData();
            checkAuth();
            setupEventListeners();
            applyTheme();
        }
        
        function loadData() {
            const saved = localStorage.getItem("templeAppData");
            if (saved) { try { const parsed = JSON.parse(saved); appData = { ...appData, ...parsed }; } catch(e) {} }
            
            if (appData.members.length === 0) {
                appData.members = [
                    { id: 1, name: "राम प्रसाद", fatherName: "सीता राम", mobile: "9876543210", village: "अयोध्या", address: "मंदिर के पास", monthlyAmount: 200, joinDate: "2024-01-01", photo: "" },
                    { id: 2, name: "हरि शंकर", fatherName: "राम शंकर", mobile: "9876543211", village: "वृंदावन", address: "मेन बाजार", monthlyAmount: 150, joinDate: "2024-01-15", photo: "" }
                ];
            }
            if (appData.payments.length === 0) {
                const currentDate = new Date();
                appData.members.forEach(member => {
                    for (let m = 0; m <= currentDate.getMonth(); m++) {
                        appData.payments.push({
                            id: Date.now() + m + member.id, memberId: member.id, memberName: member.name, month: monthNames[m], monthIndex: m,
                            year: currentDate.getFullYear(), amountPaid: m === 0 ? member.monthlyAmount : 0, pendingAmount: m === 0 ? 0 : member.monthlyAmount,
                            status: m === 0 ? "Paid" : "Pending", receiptNo: m === 0 ? `BHAVYA-${currentDate.getFullYear()}-${member.id}` : "",
                            paymentDate: m === 0 ? new Date().toISOString().split('T')[0] : "", paymentMode: m === 0 ? "UPI" : "", addedBy: "system", addedByName: "सिस्टम"
                        });
                    }
                });
            }
            if (appData.expenses.length === 0) {
                appData.expenses = [{ id: 1, category: "निर्माण", amount: 5000, description: "मंदिर नवीनीकरण", date: "2025-01-10", year: 2025, month: "जनवरी", addedBy: "system", addedByName: "सिस्टम" }];
            }
            saveData();
        }
        
        function saveData() { localStorage.setItem("templeAppData", JSON.stringify(appData)); }
        
        // ==================== AUTHENTICATION ====================
        function checkAuth() {
            const savedUser = sessionStorage.getItem("currentUser");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                updateUserDisplay();
                renderCurrentPage();
                return true;
            }
            return false;
        }
        
        function doLogin() {
            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value;
            const user = USERS.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = { ...user, password: undefined };
                sessionStorage.setItem("currentUser", JSON.stringify(currentUser));
                document.getElementById("loginContainer").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                updateUserDisplay();
                renderCurrentPage();
                showToast("✅ लॉगिन सफल! स्वागत है " + user.name);
            } else {
                alert("❌ गलत यूजरनेम या पासवर्ड!\n\n✅ सही लॉगिन:\nadmin / admin123\nsuperadmin / Bhavya@2026\noperator / Seva@2026\nviewer / View@2026");
            }
        }
        
        function showForgotPassword() {
            const modalBody = document.getElementById("modalBody");
            modalBody.innerHTML = `<h3>🔐 पासवर्ड रीसेट</h3>

        function hasPermission(action) {
            if (!currentUser) return false;
            const role = currentUser.role;

            if (role === "admin") return ["view", "add", "edit", "delete", "manage_users", "manage_settings", "add_payment", "add_member", "edit_payment", "manage_committee", "manage_expenses", "manage_social"].includes(action);
            if (role === "operator") return ["view", "add_payment", "add_member", "send_message"].includes(action);

            return false;
        }

        function sendPaymentReceipt(member, payment, amount) {

        function sendPendingReminder(member) {
            const pending = appData.payments.filter(p => p.memberId === member.id && p.status === "Pending");
            const totalPending = pending.reduce((s,p) => s + p.pendingAmount, 0);
            const message = `🚩 *जय श्री राम* 🚩\n\nआदरणीय *${member.name} जी*,\nआपका मासिक दान बकाया है।\n\n💰 *कुल बकाया: ₹${totalPending}*\n💸 *UPI: ${appData.settings.upiId}*\n\n👇 *भुगतान यहाँ करें:*\nupi://pay?pa=${appData.settings.upiId}&pn=${encodeURIComponent(member.name)}&am=${totalPending}&cu=INR\n\nभवदीय,\n${appData.settings.presidentName}`;
            if(member.mobile && member.mobile.length === 10) window.open(`https://wa.me/91${member.mobile}?text=${encodeURIComponent(message)}`, '_blank');
        }
        
        function sendBulkReminders() {
            const pendingMembers = appData.members.filter(m => appData.payments.some(p => p.memberId === m.id && p.status === "Pending"));

            showToast(`📱 ${pendingMembers.length} दानदाताओं को रिमाइंडर भेज रहे हैं...`);
        }

        function renderPaymentsTable() {
            const yearFilter = parseInt(document.getElementById("filterYear")?.value) || currentYear;

                    payment.amountPaid += amount; payment.pendingAmount = Math.max(0, member.monthlyAmount - payment.amountPaid);
                    payment.status = payment.pendingAmount <= 0 ? "Paid" : "Pending";

                    payment.addedBy = currentUser.username; payment.addedByName = currentUser.name;

                    appData.payments.push({ id: Date.now(), memberId, memberName: member.name, month: monthNames[monthIndex], monthIndex, year, amountPaid: amount, pendingAmount: Math.max(0, member.monthlyAmount - amount), status: amount >= member.monthlyAmount ? "Paid" : "Pending", receiptNo, paymentDate, paymentMode: document.getElementById("mode").value, addedBy: currentUser.username, addedByName: currentUser.name });
                }
                saveData(); closeModal(); renderPayments(); sendPaymentReceipt(member, payment || appData.payments[appData.payments.length-1], amount);

        // ==================== INCOME EXPENSE ====================
        function renderIncomeExpense() {
            const yearData = appData.payments.filter(p => p.year === currentYear);
            const yearExpenses = appData.expenses.filter(e => e.year === currentYear);

            const monthlyReport = monthNames.map((month, idx) => {

                const expense = yearExpenses.filter(e => e.month === month).reduce((s,e) => s + e.amount, 0);
                totalIncome += income; totalExpense += expense;
                return { month, income, expense, profit: income - expense };
            });
            const html = `<div class="year-selector"><label>वर्ष चुनें:</label><select id="reportYear" onchange="changeReportYear()">${years.map(y => `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}</option>`).join('')}</select>

                <div class="card"><div class="card-title">वर्ष ${currentYear} कुल व्यय</div><div class="card-value" style="color:#ef4444;">₹${totalExpense.toLocaleString()}</div></div>

                <tbody>${monthlyReport.map(r => `<tr class="${r.profit < 0 ? 'pending-row' : ''}"><td><strong>${r.month}</strong><td>₹${r.income.toLocaleString()}<td>₹${r.expense.toLocaleString()}<td>₹${r.profit.toLocaleString()}<td><span class="badge ${r.profit >= 0 ? 'badge-paid' : 'badge-pending'}">${r.profit >= 0 ? 'लाभ' : 'घाटा'}</span>`).join('')}</tbody></table></div></div>

            document.getElementById("pageContent").innerHTML = html;
            const ctx = document.getElementById('incomeExpenseChart')?.getContext('2d');
            if(ctx) new Chart(ctx, { type: 'line', data: { labels: monthlyReport.map(r => r.month), datasets: [{ label: 'आय', data: monthlyReport.map(r => r.income), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true }, { label: 'व्यय', data: monthlyReport.map(r => r.expense), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true }] }, options: { responsive: true } });
        }

                <div class="social-icon social-fb" onclick="openLink('${appData.settings.facebookLink}')"><i class="fab fa-facebook-f"></i></div>
                <div class="social-icon social-ig" onclick="openLink('${appData.settings.instagramLink}')"><i class="fab fa-instagram"></i></div>
                <div class="social-icon social-yt" onclick="openLink('${appData.settings.youtubeLink}')"><i class="fab fa-youtube"></i></div>
            </div>
            ${hasPermission("manage_social") ? `<hr><h4>⚙️ लिंक एडिट करें</h4>
                <div class="form-group"><label>WhatsApp</label><input type="text" id="waLink" value="${appData.settings.whatsappLink}"></div>
                <div class="form-group"><label>Telegram</label><input type="text" id="tgLink" value="${appData.settings.telegramLink}"></div>
                <div class="form-group"><label>Facebook</label><input type="text" id="fbLink" value="${appData.settings.facebookLink}"></div>
                <div class="form-group"><label>Instagram</label><input type="text" id="igLink" value="${appData.settings.instagramLink}"></div>
                <div class="form-group"><label>YouTube</label><input type="text" id="ytLink" value="${appData.settings.youtubeLink}"></div>
                <button class="btn btn-primary" onclick="saveSocialLinks()">सेव करें</button>` : ''}
                <hr><button class="btn btn-success" onclick="joinWhatsAppGroup()"><i class="fab fa-whatsapp"></i> WhatsApp Group जॉइन करें</button>
                <button class="btn btn-info" onclick="joinTelegramChannel()" style="background:#0088cc;color:white;"><i class="fab fa-telegram"></i> Telegram जॉइन करें</button>
            </div>`;
            document.getElementById("pageContent").innerHTML = html;
        }
        
        function openLink(url) { if(url && url !== "#") window.open(url, '_blank'); else alert("लिंक सेट नहीं!"); }
        function joinWhatsAppGroup() { openLink(appData.settings.whatsappLink); }
        function joinTelegramChannel() { openLink(appData.settings.telegramLink); }
        function saveSocialLinks() { appData.settings.whatsappLink = document.getElementById("waLink").value; appData.settings.telegramLink = document.getElementById("tgLink").value; appData.settings.facebookLink = document.getElementById("fbLink").value; appData.settings.instagramLink = document.getElementById("igLink").value; appData.settings.youtubeLink = document.getElementById("ytLink").value; saveData(); showToast("✅ सेव हो गया!"); }
        
        // ==================== ABOUT ====================
        function renderAbout() {
            const html = `<div class="card"><h3>ℹ️ समिति के बारे में</h3><p>${appData.settings.aboutText}</p><hr><h4>📞 संपर्क</h4><p><strong>अध्यक्ष:</strong> ${appData.settings.presidentName}</p><p><strong>सचिव:</strong> ${appData.settings.secretaryName}</p><p><strong>UPI:</strong> ${appData.settings.upiId}</p>
                ${hasPermission("manage_settings") ? `<hr><h4>✏️ जानकारी एडिट करें</h4><textarea id="aboutText" rows="4">${appData.settings.aboutText}</textarea><button class="btn btn-primary" onclick="saveAboutText()">सेव करें</button>` : ''}</div>`;
            document.getElementById("pageContent").innerHTML = html;
        }
        function saveAboutText() { appData.settings.aboutText = document.getElementById("aboutText").value; saveData(); showToast("✅ सेव हो गया!"); }
        
        // ==================== USERS ====================
        function renderUsers() {
            if (!hasPermission("manage_users")) { document.getElementById("pageContent").innerHTML = "<div class='card'><h3>🔒 Access Denied</h3></div>"; return; }
            const html = `<div><button class="btn btn-primary" onclick="showAddUserModal()"><i class="fas fa-user-plus"></i> नया यूजर जोड़ें</button>
                ${currentUser?.role === "super_admin" ? `<button class="btn btn-danger" onclick="resetAllData()" style="margin-left:10px;"><i class="fas fa-trash"></i> पूरा डेटा रीसेट (एडमिन पुष्टि)</button>` : ''}</div>
                <div class="card"><div class="table-container"><table><thead><tr><th>यूजरनेम</th><th>नाम</th><th>मोबाइल</th><th>रोल</th><th>कार्य</th></tr></thead>
                <tbody>${USERS.map(u => `<tr><td class="${u.role === 'operator' ? 'pending-row' : ''}">${u.username}<td class="${u.role === 'operator' ? 'pending-row' : ''}">${u.name}<td class="${u.role === 'operator' ? 'pending-row' : ''}"><input type="tel" id="mobile_${u.id}" value="${u.mobile}" style="width:120px;"><td class="${u.role === 'operator' ? 'pending-row' : ''}">${u.role === 'super_admin' ? 'सुपर एडमिन' : (u.role === 'admin' ? 'एडमिन' : (u.role === 'operator' ? 'ऑपरेटर' : 'दर्शक'))}
                <td class="action-btns"><button class="btn btn-warning" onclick="updateUser(${u.id})">अपडेट</button>
                ${u.username !== 'superadmin' ? `<button class="btn btn-danger" onclick="deleteUser(${u.id})">हटाएं</button>` : ''}
                ${u.role === 'operator' && currentUser?.role === 'super_admin' ? `<button class="btn btn-primary" onclick="makeAdmin(${u.id})">एडमिन बनाएं</button>` : ''}
                ${u.role === 'admin' && currentUser?.role === 'super_admin' && u.username !== 'admin' ? `<button class="btn btn-warning" onclick="makeOperator(${u.id})">ऑपरेटर बनाएं</button>` : ''}
                </tr>`).join('')}</tbody></table></div></div>`;
            document.getElementById("pageContent").innerHTML = html;
        }
        
        function resetAllData() {
            if(currentUser?.role !== "super_admin") { alert("❌ केवल सुपर एडमिन!"); return; }
            if(confirm("⚠️ सारा डेटा डिलीट हो जाएगा! क्या आप sure हैं?")) {
                const adminPass = prompt("पुष्टि के लिए एडमिन का पासवर्ड डालें:");
                const admin = USERS.find(u => u.role === "admin");
                if(admin && admin.password === adminPass) { localStorage.clear(); alert("✅ रीसेट! पेज रिफ्रेश हो रहा है..."); location.reload(); }
                else alert("❌ एडमिन पासवर्ड गलत!");
            }
        }
        
        function updateUser(userId) {
            const mobile = document.getElementById(`mobile_${userId}`).value;
            if(mobile.length !== 10) { alert("10 अंक का मोबाइल!"); return; }
            const user = USERS.find(u => u.id === userId);
            if(user) { user.mobile = mobile; if(appData.users) { const au = appData.users.find(u => u.id === userId); if(au) au.mobile = mobile; } saveData(); alert("✅ अपडेट!"); renderUsers(); }
        }
        
        function showAddUserModal() {
            const modalBody = document.getElementById("modalBody");
            modalBody.innerHTML = `<h3>➕ यूजर जोड़ें</h3><div class="form-group"><label>यूजरनेम</label><input type="text" id="username"></div>
                <div class="form-group"><label>नाम</label><input type="text" id="name"></div><div class="form-group"><label>मोबाइल</label><input type="tel" id="mobile"></div>
                <div class="form-group"><label>पासवर्ड</label><input type="password" id="password"></div><div class="form-group"><label>रोल</label><select id="role"><option value="viewer">दर्शक</option><option value="operator">ऑपरेटर</option><option value="admin">एडमिन</option></select></div>`;
            document.getElementById("modalConfirmBtn").onclick = () => {
                if(!document.getElementById("username").value || !document.getElementById("password").value || !document.getElementById("mobile").value) { alert("सब जरूरी!"); return; }
                const newId = USERS.length + 1;
                USERS.push({ id: newId, username: document.getElementById("username").value, name: document.getElementById("name").value, mobile: document.getElementById("mobile").value, password: document.getElementById("password").value, role: document.getElementById("role").value });
                appData.users.push({ id: newId, username: document.getElementById("username").value, name: document.getElementById("name").value, mobile: document.getElementById("mobile").value, password: document.getElementById("password").value, role: document.getElementById("role").value });
                saveData(); closeModal(); renderUsers(); showToast("✅ यूजर जुड़ गया!");
            };
            document.getElementById("modal").style.display = "flex";
        }
        
        function deleteUser(id) { if(confirm("हटाएं?")) { const idx = USERS.findIndex(u => u.id === id); if(idx !== -1 && USERS[idx].username !== 'superadmin') { USERS.splice(idx,1); appData.users = appData.users.filter(u => u.id !== id); saveData(); renderUsers(); } else alert("सुपर एडमिन नहीं हट सकता!"); } }
        function makeAdmin(id) { const u = USERS.find(u => u.id === id); if(u && u.role === "operator") { u.role = "admin"; if(appData.users) { const au = appData.users.find(au => au.id === id); if(au) au.role = "admin"; } saveData(); renderUsers(); } }
        function makeOperator(id) { const u = USERS.find(u => u.id === id); if(u && u.role === "admin" && u.username !== 'admin') { u.role = "operator"; if(appData.users) { const au = appData.users.find(au => au.id === id); if(au) au.role = "operator"; } saveData(); renderUsers(); } else alert("डिफॉल्ट एडमिन नहीं बदल सकता!"); }
        
        // ==================== SETTINGS ====================
        function renderSettings() {
            if (!hasPermission("manage_settings")) { document.getElementById("pageContent").innerHTML = "<div class='card'><h3>🔒 Access Denied</h3></div>"; return; }
            const html = `<div class="card"><h3>⚙️ सेटिंग्स</h3><div class="form-group"><label>समिति का नाम</label><input type="text" id="committeeName" value="${appData.settings.committeeName}"></div>
                <div class="form-group"><label>बैनर</label><input type="text" id="committeeBanner" value="${appData.settings.committeeBanner}"></div>
                <div class="form-group"><label>UPI ID</label><input type="text" id="upiId" value="${appData.settings.upiId}"></div>
                <div class="form-group"><label>अध्यक्ष</label><input type="text" id="presidentName" value="${appData.settings.presidentName}"></div>
                <div class="form-group"><label>सचिव</label><input type="text" id="secretaryName" value="${appData.settings.secretaryName}"></div>
                <div class="form-group"><label>डिफॉल्ट मासिक</label><input type="number" id="defaultMonthly" value="${appData.settings.defaultMonthlyAmount}"></div>
                <button class="btn btn-primary" onclick="saveSettings()">सेव करें</button></div>
                <div class="card"><h3>🖼️ लोगो बदलें</h3><input type="file" id="logoInput" accept="image/*"><div id="logoPreview"></div><button class="btn btn-primary" onclick="changeLogo()">अपलोड करें</button></div>`;
            document.getElementById("pageContent").innerHTML = html;
            if(appData.settings.logo) document.getElementById("logoPreview").innerHTML = `<img src="${appData.settings.logo}" style="width:80px;border-radius:50%;margin-top:10px;">`;
        }
        
        function saveSettings() {
            appData.settings.committeeName = document.getElementById("committeeName").value;
            appData.settings.committeeBanner = document.getElementById("committeeBanner").value;
            appData.settings.upiId = document.getElementById("upiId").value;
            appData.settings.presidentName = document.getElementById("presidentName").value;
            appData.settings.secretaryName = document.getElementById("secretaryName").value;
            appData.settings.defaultMonthlyAmount = parseInt(document.getElementById("defaultMonthly").value);
            document.getElementById("committeeName").innerText = appData.settings.committeeName;
            document.getElementById("committeeBanner").innerText = appData.settings.committeeBanner;
            saveData(); showToast("✅ सेव हो गया!");
        }
        
        function changeLogo() {
            const input = document.getElementById("logoInput");
            if(input && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => { appData.settings.logo = ev.target.result; saveData(); document.getElementById("templeLogo").innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; showToast("✅ लोगो बदल गया!"); };
                reader.readAsDataURL(input.files[0]);
            } else alert("पहले फोटो select करें!");
        }
        
        // ==================== HELPERS ====================
        function generateReceipt(paymentId) {
            const payment = appData.payments.find(p => p.id === paymentId);
            if(payment) {
                const member = appData.members.find(m => m.id === payment.memberId);
                const html = `<div style="max-width:450px;margin:auto;background:white;border-radius:16px;padding:20px;"><h3 style="color:#FF9933;">💰 भुगतान रसीद</h3><hr>
                    <p><strong>रसीद:</strong> ${payment.receiptNo}</p><p><strong>दिनांक:</strong> ${payment.paymentDate}</p><p><strong>दानदाता:</strong> ${member?.name}</p>
                    <p><strong>महीना:</strong> ${payment.month} ${payment.year}</p><p><strong>राशि:</strong> ₹${payment.amountPaid}</p><p><strong>UPI:</strong> ${appData.settings.upiId}</p>
                    <hr><p>हनुमान जी की कृपा बनी रहे। 🙏</p></div>`;
                const win = window.open(); win.document.write(html); win.document.close();
            }
        }
        
        function setupEventListeners() { document.querySelectorAll('.nav-tab').forEach(tab => { tab.addEventListener('click', () => { currentTab = tab.dataset.tab; document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); renderCurrentPage(); }); }); }
        function switchTab(tabName) { currentTab = tabName; renderCurrentPage(); }
        function renderCurrentPage() {
            switch(currentTab) {
                case "dashboard": renderDashboard(); break;
                case "members": renderMembers(); break;
                case "payments": renderPayments(); break;
                case "pending": renderPending(); break;
                case "incomeExpense": renderIncomeExpense(); break;
                case "committee": renderCommittee(); break;
                case "expenses": renderExpenses(); break;
                case "drive": renderDrive(); break;
                case "social": renderSocial(); break;
                case "about": renderAbout(); break;
                case "users": renderUsers(); break;
                case "settings": renderSettings(); break;
                default: renderDashboard();
            }
        }
        function toggleLanguage() { currentLang = currentLang === "hi" ? "en" : "hi"; document.querySelector(".lang-btn").innerHTML = currentLang === "hi" ? "🌐 हिंदी" : "🌐 English"; renderCurrentPage(); updateNavTexts(); }
        function updateNavTexts() { const tabs = ["dashboard","members","payments","pending","incomeExpense","committee","expenses","drive","social","about","users","settings"]; document.querySelectorAll(".nav-tab").forEach((tab,i) => { if(tabs[i]) tab.innerHTML = tab.innerHTML.replace(/[^<]*/, `<i class="${tab.innerHTML.match(/<i class="([^"]+)"/)[1]}"></i> ${t(tabs[i])}`); }); }
        function toggleDarkMode() { document.body.classList.toggle('dark'); appData.settings.darkMode = document.body.classList.contains('dark'); saveData(); }
        function applyTheme() { if(appData.settings.darkMode) document.body.classList.add('dark'); if(appData.settings.logo) document.getElementById("templeLogo").innerHTML = `<img src="${appData.settings.logo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`; }
        function closeModal() { document.getElementById("modal").style.display = "none"; }
        function showToast(msg) { let t = document.querySelector('.toast'); if(t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        
        init();
    </script>
</body>
</html>
